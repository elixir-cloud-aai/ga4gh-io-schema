<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>I/O Schema form (proof of concept)</title>
    <link rel="stylesheet" href="form.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <p class="brand">GA4GH I/O Schema <span class="brand-tag">Live demo</span></p>
        <p hidden class="picker">
          <label for="workflow">Workflow in TRS</label>
          <select id="workflow"></select>
        </p>
      </div>
    </header>
    <main>
      <p class="poc">
        Proof of concept of the GA4GH I/O Schema proposal, not a product.
        <span id="wes"></span>
      </p>
      <div class="tabs" role="tablist" aria-label="Views">
        <button type="button" class="tab" role="tab" id="tab-inputs" data-tab="inputs"
                aria-controls="panel-inputs" aria-selected="true">Inputs</button>
        <button type="button" class="tab" role="tab" id="tab-outputs" data-tab="outputs"
                aria-controls="panel-outputs" aria-selected="false" tabindex="-1">Outputs</button>
      </div>
      <!-- Focusable as long as it has no form (no pick, an error, the host
           failed), with nothing else to focus (ARIA tab pattern); app.js
           takes it out of the tab order once the form is rendered -->
      <div class="tabpanel" role="tabpanel" id="panel-inputs" aria-labelledby="tab-inputs"
           tabindex="0">
        <div class="panels">
          <section class="card" aria-label="Workflow inputs">
            <h1 id="title"></h1>
            <p id="description"></p>
            <io-schema-form></io-schema-form>
          </section>
          <section class="card request" aria-labelledby="request-heading">
            <h2 id="request-heading">WES run request</h2>
            <pre id="request">(submit the form)</pre>
            <button type="button" id="submit-run" hidden>Send to WES</button>
            <p id="run" class="run"></p>
          </section>
        </div>
      </div>
      <div class="tabpanel" role="tabpanel" id="panel-outputs" aria-labelledby="tab-outputs"
           tabindex="0" hidden>
        <section class="card" aria-label="Workflow outputs">
          <p class="placeholder">
            The outputs on this tab will be mock data that stand in for a
            run, not the outputs of a run sent from this page.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
